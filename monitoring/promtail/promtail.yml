server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /run/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10
    timeout: 10s

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Bỏ qua chính promtail để tránh vòng lặp log
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*promtail.*)'
        action: drop
      # Gán nhãn container (loại bỏ dấu / ở đầu)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Gán nhãn compose_service từ nhãn của Docker Compose
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      # Gán nhãn service từ nhãn của Docker Compose
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      # Dự phòng gán service từ tên container nếu không có nhãn compose (bỏ tiền tố hotel_)
      - source_labels: ['service', '__meta_docker_container_name']
        regex: ';/hotel_(.*)'
        target_label: 'service'
      # Gán nhãn service_name tương thích
      - source_labels: ['service']
        target_label: 'service_name'
      # Gán nhãn job="webapp" cho các thành phần webapp (backend, nginx, frontend)
      # để hỗ trợ trực tiếp các câu truy vấn {job="webapp"}
      - source_labels: ['service']
        regex: '(backend|nginx|frontend)'
        target_label: 'job'
        replacement: 'webapp'
      # Với các container khác, gán job bằng tên service (postgres, loki, promtail, prometheus,...)
      - source_labels: ['job', 'service']
        regex: ';(.*)'
        target_label: 'job'
      # Đường dẫn file log JSON của container
      - source_labels: ['__meta_docker_container_log_path']
        target_label: '__path__'
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          stream:
      - output:
          source: output
