# =========================================================================
# NGINX REVERSE PROXY & SECURITY CONFIGURATION
# Hệ thống Đặt phòng Khách sạn (Hotel Booking System)
# =========================================================================

# Khai báo Upstream Services theo tên service và cổng nội bộ trong Docker Compose
upstream frontend_service {
    server frontend:5173;
    keepalive 32;
}

upstream backend_service {
    server backend:5001;
    keepalive 32;
}

# -------------------------------------------------------------------------
# 1. HTTP SERVER (Cổng 80)
# -------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Ẩn phiên bản Nginx để tăng cường bảo mật
    server_tokens off;

    # Kích thước tệp tải lên tối đa (hỗ trợ ảnh QR VietQR)
    client_max_body_size 10M;

    # =====================================================================
    # CÁC SECURITY HEADERS CƠ BẢN (Theo yêu cầu Đề bài Mục 3)
    # =====================================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Phục vụ Prometheus Nginx Exporter thu thập metrics
    location /stub_status {
        stub_status on;
        access_log off;
        allow all;
    }

    # Chuyển hướng các request /api đến Backend REST API
    location /api {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Phục vụ tệp tĩnh tải lên từ Backend (Ảnh QR, v.v.)
    location /uploads {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chuyển hướng các request giao diện / đến Frontend SPA React
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# -------------------------------------------------------------------------
# 2. HTTPS SERVER (Cổng 443 - Chứng chỉ SSL tự ký)
# -------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost _;

    # Đường dẫn chứng chỉ SSL tự ký
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    # Cấu hình giao thức và mã hóa SSL an toàn
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Ẩn phiên bản Nginx
    server_tokens off;

    # Kích thước tệp tải lên tối đa
    client_max_body_size 10M;

    # =====================================================================
    # CÁC SECURITY HEADERS CƠ BẢN
    # =====================================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Phục vụ Prometheus Nginx Exporter thu thập metrics
    location /stub_status {
        stub_status on;
        access_log off;
        allow all;
    }

    # Chuyển hướng các request /api đến Backend REST API
    location /api {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Phục vụ tệp tĩnh tải lên từ Backend (Ảnh QR, v.v.)
    location /uploads {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chuyển hướng các request giao diện / đến Frontend SPA React
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
