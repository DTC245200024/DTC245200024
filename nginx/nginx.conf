# =========================================================================
# NGINX REVERSE PROXY & SECURITY CONFIGURATION
# Hệ thống Đặt phòng Khách sạn (Hotel Booking System)
# =========================================================================

# Khai báo Upstream Services theo tên service và cổng nội bộ trong Docker Compose
upstream frontend_service {
    server frontend:5173;
    keepalive 32;
}

upstream backend_service {
    server backend:5001;
    keepalive 32;
}

# =========================================================================
# NGINX RATE LIMITING (Theo yêu cầu Đề bài Mục 3 & Bảo mật Hệ thống)
# =========================================================================
# 1. Zone giới hạn tốc độ chung cho toàn bộ API (60 req/phút, lưu IP 10MB)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

# 2. Zone giới hạn nghiêm ngặt cho Endpoint Đăng Nhập (5 req/phút, burst 5)
# Cho phép tối đa 5 request liên tiếp, từ request thứ 6 trong burst sẽ trả HTTP 429
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# Cấu hình mã lỗi HTTP 429 Too Many Requests khi vượt ngưỡng Rate Limit
limit_req_status 429;
limit_req_log_level warn;

# -------------------------------------------------------------------------
# 1. HTTP SERVER (Cổng 80)
# -------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Ẩn phiên bản Nginx để tăng cường bảo mật
    server_tokens off;

    # Kích thước tệp tải lên tối đa (hỗ trợ ảnh QR VietQR)
    client_max_body_size 10M;

    # =====================================================================
    # CÁC SECURITY HEADERS CƠ BẢN & MỞ RỘNG (Theo yêu cầu Đề bài Mục 3 & Mục 6)
    # =====================================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://img.vietqr.io https:; connect-src 'self' ws: wss: http: https:; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;

    # Phục vụ Prometheus Nginx Exporter thu thập metrics
    location /stub_status {
        stub_status on;
        access_log off;
        allow all;
    }

    # Xử lý trang lỗi 429 trả về JSON chuẩn
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"success":false,"status":429,"message":"Quá nhiều yêu cầu đăng nhập. Vui lòng thử lại sau 1 phút (Nginx Rate Limit)."}';
    }

    # Endpoint đăng nhập thực tế của hệ thống (/api/auth/login)
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Hỗ trợ endpoint /login.php (tương thích các kịch bản kiểm thử bảo mật / pentest)
    location = /login.php {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://backend_service/api/auth/login;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chuyển hướng các request /api đến Backend REST API
    location /api {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Phục vụ tệp tĩnh tải lên từ Backend (Ảnh QR, v.v.)
    location /uploads {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chuyển hướng các request giao diện / đến Frontend SPA React
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# -------------------------------------------------------------------------
# 2. HTTPS SERVER (Cổng 443 - Chứng chỉ SSL tự ký)
# -------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost _;

    # Đường dẫn chứng chỉ SSL tự ký
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    # Cấu hình giao thức và mã hóa SSL an toàn
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Ẩn phiên bản Nginx
    server_tokens off;

    # Kích thước tệp tải lên tối đa
    client_max_body_size 10M;

    # =====================================================================
    # CÁC SECURITY HEADERS CƠ BẢN & MỞ RỘNG (Theo yêu cầu Đề bài Mục 3 & Mục 6)
    # =====================================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://img.vietqr.io https:; connect-src 'self' ws: wss: http: https:; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;

    # Phục vụ Prometheus Nginx Exporter thu thập metrics
    location /stub_status {
        stub_status on;
        access_log off;
        allow all;
    }

    # Xử lý trang lỗi 429 trả về JSON chuẩn
    error_page 429 = @rate_limited_ssl;
    location @rate_limited_ssl {
        default_type application/json;
        return 429 '{"success":false,"status":429,"message":"Quá nhiều yêu cầu đăng nhập. Vui lòng thử lại sau 1 phút (Nginx Rate Limit)."}';
    }

    # Endpoint đăng nhập thực tế của hệ thống (/api/auth/login)
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Hỗ trợ endpoint /login.php (tương thích các kịch bản kiểm thử bảo mật / pentest)
    location = /login.php {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://backend_service/api/auth/login;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chuyển hướng các request /api đến Backend REST API
    location /api {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Phục vụ tệp tĩnh tải lên từ Backend (Ảnh QR, v.v.)
    location /uploads {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chuyển hướng các request giao diện / đến Frontend SPA React
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
