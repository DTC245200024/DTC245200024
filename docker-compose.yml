services:
  # =========================================================================
  # 1. DATABASE SERVICE (MongoDB NoSQL Document Database)
  # =========================================================================
  database:
    image: mongo:6.0
    container_name: hotel_database
    restart: unless-stopped
    ports:
      - "${DB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-hotel_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME:-hotel_booking_db}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@grandpalace.vn}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - hotel-network

  # =========================================================================
  # 2. DATABASE MANAGEMENT TOOL (Mongo-Express Web GUI)
  # =========================================================================
  db-admin:
    image: mongo-express:latest
    container_name: hotel_db_admin
    restart: unless-stopped
    ports:
      - "${DB_ADMIN_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_USER:-hotel_admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: database
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: ${DB_ADMIN_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${DB_ADMIN_PASSWORD}
    depends_on:
      - database
    networks:
      - hotel-network

  # =========================================================================
  # 3. BACKEND API SERVICE (Node.js Express REST API)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel_backend
    restart: unless-stopped
    expose:
      - "5001"
    environment:
      PORT: 5001
      NODE_ENV: ${NODE_ENV:-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@grandpalace.vn}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MONGODB_URI: mongodb://${DB_USER:-hotel_admin}:${DB_PASSWORD}@database:27017/${DB_NAME:-hotel_booking_db}?authSource=admin
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    depends_on:
      - database
    networks:
      - hotel-network

  # =========================================================================
  # 4. FRONTEND WEB SERVICE (React 19 + Vite SPA)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: hotel_frontend
    restart: unless-stopped
    expose:
      - "5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      - backend
    networks:
      - hotel-network

  # =========================================================================
  # 5. REVERSE PROXY & SECURITY SERVICE (Nginx Reverse Proxy & SSL)
  # =========================================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: hotel_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - hotel-network

  # =========================================================================
  # 6. CONTAINER MONITORING SERVICE (cAdvisor)
  # =========================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: hotel_cadvisor
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"
    networks:
      - hotel-network

  # =========================================================================
  # 7. NGINX METRICS EXPORTER (Nginx Prometheus Exporter)
  # =========================================================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: hotel_nginx_exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    expose:
      - "9113"
    depends_on:
      - nginx
    networks:
      - hotel-network

  # =========================================================================
  # 8. MONGODB METRICS EXPORTER (Percona MongoDB Exporter)
  # =========================================================================
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: hotel_mongodb_exporter
    restart: unless-stopped
    command:
      - --collect-all
      - --compatible-mode
    environment:
      MONGODB_URI: "mongodb://${DB_USER:-hotel_admin}:${DB_PASSWORD}@database:27017/admin?authSource=admin"
    expose:
      - "9216"
    depends_on:
      - database
    networks:
      - hotel-network

  # =========================================================================
  # 9. MONITORING SERVER (Prometheus Time-Series Database)
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: hotel_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - cadvisor
      - nginx-exporter
      - mongodb-exporter
    networks:
      - hotel-network

  # =========================================================================
  # 10. METRICS VISUALIZATION (Grafana Dashboard)
  # =========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: hotel_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - hotel-network

networks:
  hotel-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
