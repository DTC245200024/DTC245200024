services:
  # =========================================================================
  # 1. DATABASE SERVICE (PostgreSQL Relational Database)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: hotel_postgres
    restart: unless-stopped
    # Không publish port 5432 ra Internet (Security Hardening: chỉ bind 127.0.0.1)
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-${DB_NAME:-hotel_booking_db}}
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USER:-hotel_admin}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:?Hãy đặt POSTGRES_PASSWORD hoặc DB_PASSWORD trong file .env}}
      # Dùng bởi database/init/01-roles.sh để tạo role đặc quyền tối thiểu
      APP_DB_USER: ${APP_DB_USER:-hotel_app_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Hãy đặt APP_DB_PASSWORD trong file .env}
      EXPORTER_DB_USER: ${EXPORTER_DB_USER:-hotel_exporter}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD:?Hãy đặt EXPORTER_DB_PASSWORD trong file .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net

  # =========================================================================
  # 2. DATABASE MANAGEMENT TOOL (pgAdmin 4 Web GUI)
  # =========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hotel_pgadmin
    restart: unless-stopped
    # Chỉ mở pgAdmin trên localhost của máy chủ (không công khai ra mạng)
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:8080"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Hãy đặt PGADMIN_DEFAULT_EMAIL trong file .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Hãy đặt PGADMIN_DEFAULT_PASSWORD trong file .env}
      PGADMIN_LISTEN_PORT: "8080"
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./database/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/misc/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net

  # =========================================================================
  # 3. BACKEND API SERVICE (Node.js Express REST API)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5001}:5001"
    expose:
      - "5001"
    environment:
      PORT: 5001
      NODE_ENV: ${NODE_ENV:-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@grandpalace.vn}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hotel_booking_db}
      APP_DB_USER: ${APP_DB_USER:-hotel_app_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend_net
      - backend_net

  # =========================================================================
  # 4. FRONTEND WEB SERVICE (React 19 + Vite SPA)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: hotel_frontend
    restart: unless-stopped
    expose:
      - "5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend_net

  # =========================================================================
  # 5. REVERSE PROXY & SECURITY SERVICE (Nginx Reverse Proxy & SSL)
  # =========================================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: hotel_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    networks:
      - frontend_net
      - monitoring_net

  # =========================================================================
  # 6. CONTAINER MONITORING SERVICE (cAdvisor)
  # =========================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: hotel_cadvisor
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring_net

  # =========================================================================
  # 7. NGINX METRICS EXPORTER (Nginx Prometheus Exporter)
  # =========================================================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: hotel_nginx_exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    expose:
      - "9113"
    depends_on:
      - nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - monitoring_net

  # =========================================================================
  # 8. POSTGRESQL METRICS EXPORTER (Prometheus Postgres Exporter)
  # =========================================================================
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: hotel_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "postgres:5432/${DB_NAME:-hotel_booking_db}?sslmode=disable"
      DATA_SOURCE_USER: ${EXPORTER_DB_USER:-hotel_exporter}
      DATA_SOURCE_PASS: ${EXPORTER_DB_PASSWORD}
    expose:
      - "9187"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend_net
      - monitoring_net

  # =========================================================================
  # 9. MONITORING SERVER (Prometheus Time-Series Database)
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: hotel_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - cadvisor
      - nginx-exporter
      - postgres-exporter
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - monitoring_net

  # =========================================================================
  # 10. METRICS VISUALIZATION (Grafana Dashboard)
  # =========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: hotel_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - monitoring_net

  # =========================================================================
  # 11. CENTRALIZED LOGGING SERVER (Grafana Loki)
  # =========================================================================
  loki:
    image: grafana/loki:latest
    container_name: hotel_loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command:
      - -config.file=/etc/loki/loki.yml
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - monitoring_net

  # =========================================================================
  # 12. LOG COLLECTOR & SHIPPER (Grafana Promtail)
  # =========================================================================
  promtail:
    image: grafana/promtail:latest
    container_name: hotel_promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_data:/run/promtail
    command:
      - -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitoring_net:
    driver: bridge

volumes:
  pg_data:
    driver: local
  pgadmin_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  promtail_data:
    driver: local
